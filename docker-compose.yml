# TrueNAS stack. The library paths are mounted under the same paths as on the host
# so what the dashboard shows matches what TrueNAS shows.
services:
  episode-sorter:
    build: .
    image: episode-sorter:latest
    container_name: episode-sorter
    restart: unless-stopped
    # Runs as the media owner (smb) so moved files stay usable over SMB.
    user: "${PUID:-3000}:${PGID:-0}"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ES_DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/mnt/SmallPool/dataGrepDataset/Downloads/JDownloader}
      ES_ANIME_PATH_1: /mnt/poolToshiba/Anime
      ES_ANIME_PATH_2: /mnt/SmallPool/dataGrepDataset/Anime
      ES_SERIES_PATH: /mnt/poolToshiba/Serien
      ES_SERIES_PATH_2: /mnt/SmallPool/dataGrepDataset/Serien
      ES_MOVIES_PATH: /mnt/poolToshiba/Filme
      ES_DEFAULT_ANIME_PATH: /mnt/SmallPool/dataGrepDataset/Anime
      ES_DEFAULT_SERIES_PATH: /mnt/SmallPool/dataGrepDataset/Serien
      ES_DEFAULT_MOVIE_PATH: /mnt/poolToshiba/Filme
      ES_DRY_RUN: ${ES_DRY_RUN:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JD_EMAIL: ${JD_EMAIL:-}
      JD_PASSWORD: ${JD_PASSWORD:-}
      JD_DEVICE: ${JD_DEVICE:-}
    volumes:
      - ./data:/data
      - ${DOWNLOAD_DIR:-/mnt/SmallPool/dataGrepDataset/Downloads/JDownloader}:${DOWNLOAD_DIR:-/mnt/SmallPool/dataGrepDataset/Downloads/JDownloader}
      - /mnt/poolToshiba/Anime:/mnt/poolToshiba/Anime
      - /mnt/SmallPool/dataGrepDataset/Anime:/mnt/SmallPool/dataGrepDataset/Anime
      - /mnt/poolToshiba/Serien:/mnt/poolToshiba/Serien
      - /mnt/SmallPool/dataGrepDataset/Serien:/mnt/SmallPool/dataGrepDataset/Serien
      - /mnt/poolToshiba/Filme:/mnt/poolToshiba/Filme
    ports:
      - "${ES_PORT:-18080}:8080"

  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      USER_ID: ${PUID:-3000}
      GROUP_ID: ${PGID:-0}
      UMASK: "002"
      KEEP_APP_RUNNING: "1"
      # Web UI password. Without it anyone who reaches the port can drive JDownloader.
      VNC_PASSWORD: ${JD_UI_PASSWORD:-}
      MYJDOWNLOADER_EMAIL: ${JD_EMAIL:-}
      MYJDOWNLOADER_PASSWORD: ${JD_PASSWORD:-}
      MYJDOWNLOADER_DEVICE_NAME: ${JD_DEVICE:-truenas}
    volumes:
      - ./jdownloader-config:/config
      - ${DOWNLOAD_DIR:-/mnt/SmallPool/dataGrepDataset/Downloads/JDownloader}:/output
    ports:
      - "${JD_PORT:-5800}:5800"
      # Click'n'Load. The browser posts to 127.0.0.1:9666 on the machine it runs
      # on, so a port proxy on that machine has to forward here. LAN only, this
      # port accepts add-link commands without authentication.
      - "${JD_CNL_PORT:-9666}:9666"
      - "9665:9665"

  # Only needed when the host does not already run a cloudflared tunnel.
  # On the TrueNAS the tunnel runs as its own app, so this service stays off.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-episode-sorter
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - episode-sorter
