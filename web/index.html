<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Episode Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0f33'/><path d='M9 11h14M9 16h9M9 21h12' stroke='%233d94ff' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark">ES</span>
      <span class="brand-text">Episode Sorter</span>
    </div>
    <nav id="nav" aria-label="Bereiche">
      <button class="nav-item is-active" data-view="overview">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg></span>
        <span class="nav-label">Übersicht</span><span class="nav-count" data-count="open"></span>
      </button>
      <button class="nav-item" data-view="decisions">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12.4l2.2 2.2 4.3-4.8"/></svg></span>
        <span class="nav-label">Entscheidungen</span><span class="nav-count" data-count="review"></span>
      </button>
      <button class="nav-item" data-view="duplicates">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.4"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        <span class="nav-label">Dubletten</span><span class="nav-count" data-count="duplicate"></span>
      </button>
      <button class="nav-item" data-view="jdownloader">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 19h14"/></svg></span>
        <span class="nav-label">JDownloader</span>
      </button>
      <button class="nav-item" data-view="library">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></span>
        <span class="nav-label">Bibliothek</span>
      </button>
      <button class="nav-item" data-view="rules">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14l-5.5 6.5v5l-3 2v-7z"/></svg></span>
        <span class="nav-label">Regeln</span>
      </button>
      <button class="nav-item" data-view="log">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="2.4"/><path d="M9 9.5h6M9 13h6M9 16.5h3.5"/></svg></span>
        <span class="nav-label">Protokoll</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17.5 7H20M4 12h3M11.5 12H20M4 17h11M19.5 17H20"/><circle cx="15.2" cy="7" r="2.1"/><circle cx="9.2" cy="12" r="2.1"/><circle cx="17.2" cy="17" r="2.1"/></svg></span>
        <span class="nav-label">Einstellungen</span>
      </button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="viewTitle">Übersicht</h1>
        <p id="viewHint" class="hint">Was gerade läuft, was wartet und was schon einsortiert ist.</p>
      </div>
      <div class="topbar-right">
        <div class="statusline" id="statusLine" aria-live="polite"></div>
        <div class="topbar-actions">
          <label class="switch" for="dryRunToggle">
            <input type="checkbox" id="dryRunToggle">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="switch-label">Dry Run</span>
          </label>
          <button class="btn btn-primary" id="scanNow">Jetzt prüfen</button>
        </div>
      </div>
      <span class="topbar-track" aria-hidden="true"><span class="topbar-progress" id="scanProgress"></span></span>
    </header>

    <div id="scrollSentinel" aria-hidden="true"></div>
    <div id="activity" class="activity" role="status" aria-live="polite" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="chartTip" class="chart-tip" hidden></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>
<script src="/assets/app.js" type="module"></script>
</body>
</html>
