<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Episode Sorter</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23241d13'/><path d='M9 11h14M9 16h9M9 21h12' stroke='%23e6a94b' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark">ES</span>
      <span class="brand-text">Episode Sorter</span>
    </div>
    <nav id="nav" aria-label="Bereiche">
      <button class="nav-item is-active" data-view="overview">Übersicht<span class="nav-count" data-count="open"></span></button>
      <button class="nav-item" data-view="decisions">Entscheidungen<span class="nav-count" data-count="review"></span></button>
      <button class="nav-item" data-view="duplicates">Dubletten<span class="nav-count" data-count="duplicate"></span></button>
      <button class="nav-item" data-view="jdownloader">JDownloader</button>
      <button class="nav-item" data-view="library">Bibliothek</button>
      <button class="nav-item" data-view="rules">Regeln</button>
      <button class="nav-item" data-view="log">Protokoll</button>
      <button class="nav-item" data-view="settings">Einstellungen</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="viewTitle">Übersicht</h1>
        <p id="viewHint" class="hint">Was gerade läuft, was wartet und was schon einsortiert ist.</p>
      </div>
      <div class="topbar-right">
        <div class="statusline" id="statusLine" aria-live="polite"></div>
        <div class="topbar-actions">
          <label class="switch" for="dryRunToggle">
            <input type="checkbox" id="dryRunToggle">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="switch-label">Dry Run</span>
          </label>
          <button class="btn btn-primary" id="scanNow">Jetzt prüfen</button>
        </div>
      </div>
      <span class="topbar-track" aria-hidden="true"><span class="topbar-progress" id="scanProgress"></span></span>
    </header>

    <div id="scrollSentinel" aria-hidden="true"></div>
    <div id="activity" class="activity" role="status" aria-live="polite" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>
<script src="/assets/app.js" type="module"></script>
</body>
</html>
